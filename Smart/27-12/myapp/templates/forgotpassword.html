{% extends 'base.html' %}
{% load static %}
{% block main %}

<!-- ✅ SWEET ALERT -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- ✅ POPUP MESSAGE -->
<script>
    {% if messages %}
        {% for message in messages %}
            Swal.fire({
                icon: '{% if message.tags == "error" %}error{% else %}success{% endif %}',
                title: '{{ message.tags|title }}',
                text: "{{ message|escapejs }}",
                confirmButtonColor: '#2563eb'
            });
        {% endfor %}
    {% endif %}
</script>
<!-- HERO -->
 <section class="bg-no-repeat bg-center bg-cover bg-[#FFF6F0] h-[350px] lg:h-[513px] flex flex-wrap items-center relative before:absolute before:inset-0 before:content-[''] before:bg-[#000000] before:opacity-[70%]"
style="background-image: url('{% static 'assets/images/breadcrumb/bg-1.png' %}');">     <div class="container">
                <div class="grid grid-cols-12">
                    <div class="col-span-12">
                        <div class="max-w-[700px]  mx-auto text-center text-white relative z-[1]">
                            <h1 class="font-lora text-[32px] sm:text-[50px] md:text-[68px] lg:text-[50px] leading-tight xl:text-2xl font-medium">
                                Reset Password
                            </h1>

                            <p class="text-base mt-5 max-w-[500px] mx-auto text-center">
                                Enter your email and new password
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>


<!-- FORM -->
<div class="flex justify-center items-center py-24 bg-gradient-to-br from-gray-100 to-gray-200">

    <div class="bg-white/90 backdrop-blur-lg p-10 rounded-3xl shadow-2xl w-full max-w-md border border-gray-200">

        <!-- Title -->
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">
            Forgot Password
        </h2>
        <p class="text-center text-gray-500 mb-8 text-sm">
            Reset your password securely
        </p>


        <!-- Form -->
        <form action="{% url 'resetpassword' %}" method="post" class="space-y-6">
            {% csrf_token %}

            <!-- Email -->
    <div class="text-center mt-6">
                            <input
                                class="input-field font-light w-full sm:w-[400px] border border-primary border-opacity-60 rounded-[8px] p-[15px] focus:border-secondary focus:outline-none"
                                type="email"
                                name="email"
                                placeholder="Email"
                                required>
                        </div>

            <!-- Password -->
         <div class="text-center mt-6">
                            <input
                                class="input-field font-light w-full sm:w-[400px] border border-primary border-opacity-60 rounded-[8px] p-[15px] focus:border-secondary focus:outline-none"
                                type="password"
                                name="password"
                                placeholder="New Password"
                                required
                                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"
                                title="Min 8 chars, include uppercase, lowercase, number & special character">

                            <p class="text-sm text-gray-500 mt-2">
                                Min 8 chars: upper, lower, number & special character.
                            </p>
                        </div>

            <!-- Button -->
            <div class="text-center mt-6">
            <button type="submit"
                class="relative px-[40px] py-[15px] text-white bg-primary rounded-md hover:bg-secondary transition-all">
                Reset Password
            </button>
            </div>

        </form>

        <!-- Back -->
        <div class="text-center mt-6">
            <a href="{% url 'login' %}"
               class="text-blue-600 font-medium hover:underline hover:text-blue-800 transition">
                ← Back to Login
            </a>
        </div>

    </div>

</div>

<!-- JS for password toggle -->
<script>
function togglePassword() {
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}
</script>

{% endblock %}
