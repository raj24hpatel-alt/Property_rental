{% extends 'base.html' %}
{% block main %}
{% if messages %}
{% endif %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-xl shadow-lg w-[400px]">

        <h2 class="text-2xl font-semibold mb-5 text-center">
            Reset Password
        </h2>

        {% if messages %}
            {% for message in messages %}
                <div class="text-red-500 text-sm text-center mb-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <input type="password" name="password"
                placeholder="New Password"
                class="border border-gray-300 p-3 w-full mb-4 rounded"
                required>

            <input type="password" name="confirm_password"
                placeholder="Confirm Password"
                class="border border-gray-300 p-3 w-full mb-4 rounded"
                required>

            <button type="submit"
                class="bg-green-600 hover:bg-green-700 text-white w-full py-2 rounded">
                Reset Password
            </button>
        </form>

    </div>
</div>

{% endblock %}
